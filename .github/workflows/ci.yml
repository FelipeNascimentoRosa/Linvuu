name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 exige runner com Chromium suportado
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6 # o emulador do Firestore (testes de regras e da newsletter) exige Java
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6 # evita baixar o emulador (~60 MB) a cada execução
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firebase-tools-15.34.1
      - run: npm ci
      - name: Trava do conteúdo em inglês (docs/LEIA-ME-INTERNACIONAL.md)
        run: node scripts/travas-en.mjs
      - name: Catraca anti-tradução 1:1 do .com (Lei do .com, CLAUDE.md)
        run: npm run audit:espelho
      - name: Testar coletor e limites da auditoria Firebase sem acesso de produção
        run: python3 -m unittest discover -s scripts/auditoria_firebase -p 'test_*.py' -v
      - name: Verificar tipos TypeScript
        run: npm run lint && npm run lint:apk
      - name: Verificar política de cache e indexação das APIs
        run: node --import tsx scripts/testar-cache-api.ts
      - name: Testar redirecionamentos entre domínios (uma página, um endereço)
        run: node --import tsx scripts/testar-dominio.ts
      - name: Testar consentimento e minimização PostHog sem enviar dados
        run: node --import tsx scripts/testar-analytics.ts
      - name: Testar consentimento e eventos do pixel Meta sem enviar dados
        run: node --import tsx scripts/testar-meta-pixel.ts
      - name: Testar consentimento e eventos do pixel TikTok sem enviar dados
        run: node --import tsx scripts/testar-tiktok-pixel.ts
      - name: Testar prontidao sem dependencias de producao
        run: node --import tsx scripts/testar-prontidao.ts
      - name: Testar títulos das páginas indexáveis (até 60 caracteres)
        run: node --import tsx scripts/testar-titulos.ts
      - name: Testar as páginas de dúvida (fidelidade ao conteúdo, formato e domínio)
        run: node --import tsx scripts/testar-duvidas.ts
      - name: Testar a origem do áudio pago (repositório privado, v2 primeiro, nomes validados)
        run: node --import tsx scripts/testar-audio-privado.ts
      - name: Testar autorização antes de consultar áudio privado e suporte a Range
        run: node --import tsx scripts/testar-audio-autorizacao.ts
      - name: Testar rota assetlinks (nunca publica fingerprint inventado)
        run: node --import tsx scripts/testar-assetlinks.ts
      - name: Garantir que o checkout valida preços sem criar produtos no Stripe real
        run: node --import tsx scripts/testar-contrato-billing.ts
      - name: Testar notificações Stripe assinadas sem cobranças reais
        run: node --import tsx scripts/testar-billing-webhook.ts
      - name: Política de acesso pago (início na confirmação, soma de pacotes, reembolso, disputa, compra duplicada)
        run: node --import tsx scripts/testar-acesso-calculo.ts
      - name: Do evento do Stripe ao acesso gravado e à conversão enviada uma vez
        run: node --import tsx scripts/testar-cobranca-eventos.ts
      - name: Conversões de compra só com consentimento, dados em hash
        run: node --import tsx scripts/testar-conversoes.ts
      - name: Registro de acesso (atalho só para «tem acesso»; Google Play não some)
        run: node --import tsx scripts/testar-registro-acesso.ts
      - name: Eventos exigidos do webhook do Stripe
        run: node --import tsx scripts/testar-webhook-eventos.ts
      - name: Testar medição sem dados de produção
        run: npm run testar:medicao
      - name: Testar corretor e ditados reais
        run: node --import tsx scripts/testar-correcao-exercicios.ts
      - name: Testar isolamento do progresso
        run: npm run testar:progresso
      - name: Testar reenvio e isolamento do progresso na conta
        run: node --import tsx scripts/testar-sincronizacao-progresso.ts
      - name: Testar recuperação nativa simulada e tentativas versionadas do APK
        run: |
          node --import tsx scripts/testar-armazenamento-apk.ts
          node --import tsx scripts/testar-falha-inicial-armazenamento-apk.ts
          node --import tsx scripts/testar-tentativas-apk.ts
          node --import tsx scripts/testar-revisao-erros-apk.ts
          node --import tsx scripts/testar-primeira-abertura-apk.ts
          node --import tsx scripts/testar-rodada4-apk.ts
          node --import tsx scripts/testar-fsrs-dominio.ts
      - name: Testes das avaliações de alunos
        run: npm run testar:avaliacoes
      - name: Testar a sugestão de idioma pelo navegador
        run: node --import tsx scripts/testar-sugestao-idioma.ts
      - name: Testar validação da newsletter (tipos, tamanhos, aceite, campos extras)
        run: npm run testar:newsletter
      - name: Testar a rota da newsletter no emulador do Firestore (consentimento, repetição, limite por IP)
        run: npm run testar:newsletter:rota
      - name: Testar o domínio da revisão espaçada (FSRS, registro por bloco, conflito, isolamento de imports Web/APK)
        run: npm run testar:revisao
      - name: Testar a rota da revisão no emulador do Firestore e do Auth (validação, conflito, isolamento entre contas, limites)
        run: npm run testar:revisao:rota
      - name: Testar as regras do Firestore no emulador (duas contas fictícias e visitante)
        run: npm run testar:regras
      - run: npm run build:website
      - name: Testar isolamento dos públicos nos domínios
        run: |
          node --import tsx scripts/testar-isolamento-dominios.ts
          node scripts/testar-isolamento-http.mjs
          node scripts/testar-isolamento-navegador.mjs
      - name: Testar politica publica de indexacao
        run: node --import tsx scripts/testar-seo-publico.ts
      - name: Verificar todas as sessoes e idiomas, canonical e destinos publicos
        run: |
          node --import tsx scripts/testar-inventario-seo.ts
          node --import tsx scripts/testar-robots-navegacao.ts
          node --import tsx scripts/testar-http-seo.ts
          node --import tsx scripts/testar-links-publicos.ts
          node scripts/testar-seo-http.mjs
      - name: Auditar rotas e dominios (sitemaps, canonical, hreflang, orfas, idioma, mapa vivo)
        run: npm run audit:rotas-dominios
      - run: npm run build:apk
      - run: npm run testar:plataformas
      - name: Sistema de design (contraste nos dois temas, só var() nos módulos, CSS dentro do limite)
        run: npm run validar:design
      - name: Dependências sem vulnerabilidade conhecida (produção)
        run: |
          for i in 1 2 3; do npm audit --omit=dev --audit-level=high && exit 0; echo "tentativa $i falhou"; sleep 20; done; exit 1
      - name: Teste de segurança do servidor (cabeçalhos, API fechada, limite de uso)
        run: npm run testar:seguranca


