name: Segurança
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # toda segunda, 03h17 em Brasília
permissions:
  contents: read
jobs:
  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar e rodar o gitleaks (binário oficial, sem action de terceiros)
        run: |
          V=8.21.2
          # O download de releases do GitHub às vezes responde 504. Plano B: a imagem oficial do gitleaks no ghcr.io, mesma versão.
          if curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" && tar -xzf gl.tgz gitleaks; then
            ./gitleaks detect --source . --redact --verbose --exit-code 1
          else
            echo "Release indisponível; usando ghcr.io/gitleaks/gitleaks:v${V}"
            docker run --rm -v "$PWD:/repo" -w /repo "ghcr.io/gitleaks/gitleaks:v${V}" detect --source /repo --redact --verbose --exit-code 1
          fi
  dependencias:
    name: Auditoria completa de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoria de dependências (3 tentativas, pois o registro do npm às vezes devolve 504)
        run: |
          for i in 1 2 3; do npm audit --audit-level=moderate && exit 0; echo "tentativa $i falhou"; sleep 20; done; exit 1
      - name: Assinaturas dos pacotes
        run: |
          for i in 1 2 3; do npm audit signatures && exit 0; sleep 20; done; exit 1
