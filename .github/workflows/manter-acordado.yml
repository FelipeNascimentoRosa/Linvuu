name: Monitorar site e dependencias

# Desde 08/11/2026 o serviço do Render está no plano pago (sem hibernação): este workflow não precisa mais "acordar" o site.
# Ele só monitora processo, sitemap e dependências, a cada 6 horas (hora cheia desperdiçava ~720 min/mês de runner em repositório privado). Agendamentos do GitHub podem atrasar;
# não substitui monitoramento externo de disponibilidade.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar processo, sitemap e dependencias sem cobrancas
        run: |
          curl -fsS --max-time 90 https://linvuu.com.br/healthz
          curl -fsS --max-time 60 -o /dev/null -w "sitemap: %{http_code} %{content_type}\n" https://linvuu.com.br/sitemap.xml
          curl -fsS --max-time 90 --retry 1 --retry-delay 10 https://linvuu.com.br/readyz
