name: Revisão espaçada Web (navegador real)
on:
  pull_request:
    paths: ['server.ts', 'server/**', 'package.json', 'package-lock.json', 'src/**', 'content/idiomas/ru/**', 'scripts/testar-revisao-e2e.mjs', 'scripts/auditar-visual.mjs', '.github/workflows/revisao-web-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revisao-web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalar navegador somente no runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Subir o site local
        run: |
          NODE_ENV=production PORT=3099 nohup npx tsx server.ts > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:3099/ && exit 0; sleep 2; done
          cat /tmp/servidor.log; exit 1
      - name: Revisão Web de ponta a ponta (teclado, notas, persistência, detector visual)
        env:
          LINVUU_HOST_LOCAL: http://127.0.0.1:3099
        run: node --import tsx scripts/testar-revisao-e2e.mjs
